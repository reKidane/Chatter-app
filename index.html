-- Run this in Supabase SQL Editor

-- Enable UUID
create extension if not exists "uuid-ossp";

-- 1. profiles
create table if not exists profiles (
  id uuid primary key default uuid_generate_v4(),
  phone text unique,
  name text,
  avatar_url text,
  about text default 'Hey there! I am using Chatter Pro v2',
  last_seen timestamp default now()
);
-- 2. chats
create table if not exists chats (
  id uuid primary key default uuid_generate_v4(),
  is_group boolean default false,
  name text,
  avatar_url text,
  created_by uuid references profiles(id),
  created_at timestamp default now()
);
-- 3. chat_participants
create table if not exists chat_participants (
  chat_id uuid references chats(id) on delete cascade,
  user_id uuid references profiles(id) on delete cascade,
  is_admin boolean default false,
  joined_at timestamp default now(),
  primary key (chat_id, user_id)
);
-- 4. messages
create table if not exists messages (
  id uuid primary key default uuid_generate_v4(),
  chat_id uuid references chats(id) on delete cascade,
  sender_id uuid references profiles(id),
  type text check (type in ('text','image','video','audio','document','location','contact','poll')),
  content text,
  media_url text,
  reply_to uuid references messages(id),
  created_at timestamp default now(),
  delivered_at timestamp,
  read_at timestamp
);
-- 5. reactions
create table if not exists message_reactions (
  message_id uuid references messages(id) on delete cascade,
  user_id uuid references profiles(id) on delete cascade,
  emoji text,
  primary key (message_id, user_id, emoji)
);
-- 6. status
create table if not exists status (
  id uuid primary key default uuid_generate_v4(),
  user_id uuid references profiles(id) on delete cascade,
  media_url text,
  type text default 'image',
  caption text,
  created_at timestamp default now(),
  expires_at timestamp default now() + interval '24 hours'
);
-- 7. calls
create table if not exists calls (
  id uuid primary key default uuid_generate_v4(),
  chat_id uuid references chats(id),
  caller_id uuid references profiles(id),
  type text check (type in ('video','voice')),
  status text default 'ringing',
  started_at timestamp default now(),
  ended_at timestamp
);

-- Storage buckets
insert into storage.buckets (id, name, public) values ('avatars','avatars',true) on conflict (id) do nothing;
insert into storage.buckets (id, name, public) values ('chat_media','chat_media',true) on conflict (id) do nothing;
insert into storage.buckets (id, name, public) values ('status_media','status_media',true) on conflict (id) do nothing;

-- Enable Realtime
alter publication supabase_realtime add table messages;
alter publication supabase_realtime add table chat_participants;
alter publication supabase_realtime add table calls;

-- RLS (dev - allow all for demo, tighten in prod)
alter table profiles enable row level security;
alter table chats enable row level security;
alter table chat_participants enable row level security;
alter table messages enable row level security;
alter table message_reactions enable row level security;
alter table status enable row level security;
alter table calls enable row level security;

create policy "Allow all for anon" on profiles for all using (true) with check (true);
create policy "Allow all for anon" on chats for all using (true) with check (true);
create policy "Allow all for anon" on chat_participants for all using (true) with check (true);
create policy "Allow all for anon" on messages for all using (true) with check (true);
create policy "Allow all for anon" on message_reactions for all using (true) with check (true);
create policy "Allow all for anon" on status for all using (true) with check (true);
create policy "Allow all for anon" on calls for all using (true) with check (true);

-- Storage policies
create policy "Public read" on storage.objects for select using (bucket_id in ('avatars','chat_media','status_media'));
create policy "Allow upload" on storage.objects for insert with check (bucket_id in ('avatars','chat_media','status_media'));
